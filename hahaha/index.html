<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星星收集</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f1c2c, #928dab);
        font-family: "Microsoft YaHei", sans-serif;
        color: white;
      }
      .game-box {
        width: min(90vw, 760px);
        background: rgba(11, 18, 31, 0.7);
        border: 2px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      }
      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        background: rgba(255,255,255,0.06);
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      .title {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .status {
        display: flex;
        gap: 18px;
        font-size: 1rem;
      }
      .panel {
        padding: 12px 20px 18px;
      }
      .button-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      button {
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffb703, #fb8500);
        color: #201c1c;
        font-weight: 700;
        padding: 10px 18px;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      button:hover { transform: translateY(-1px) scale(1.02); }
      button:active { transform: translateY(0); }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: radial-gradient(circle at top, rgba(59, 130, 246, 0.2), rgba(15, 23, 42, 0.85) 45%);
        border-top: 1px solid rgba(255,255,255,0.08);
      }
      .tip {
        color: rgba(255,255,255,0.72);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <div class="hud">
        <div class="title">星星收集</div>
        <div class="status">
          <span>分数：<strong id="score">0</strong></span>
          <span>时间：<strong id="timeLeft">30</strong>s</span>
        </div>
      </div>
      <div class="panel">
        <div class="button-row">
          <button id="startBtn">开始游戏</button>
          <div class="tip">方向键 / WASD 控制角色，避开敌人</div>
        </div>
      </div>
      <canvas id="gameCanvas" width="720" height="420"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const timeLeftEl = document.getElementById('timeLeft');
      const startBtn = document.getElementById('startBtn');

      const game = {
        running: false,
        score: 0,
        timeLeft: 30,
        lastTime: 0,
        spawnTimer: 0,
        enemySpawn: 1.2,
        starSpawn: 0.8
      };

      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 24,
        speed: 260,
        color: '#60a5fa',
        image: null,
        imageWidth: 70,
        imageHeight: 124
      };

      const playerImage = new Image();
      playerImage.onload = () => {
        player.image = playerImage;
      };
      playerImage.src = 'player.jpg';

      const keys = {};
      const stars = [];
      const enemies = [];

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function randomRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createStar() {
        stars.push({
          x: randomRange(30, canvas.width - 30),
          y: randomRange(30, canvas.height - 30),
          radius: 10,
          color: '#facc15',
          pulse: Math.random() * Math.PI * 2
        });
      }

      function createEnemy() {
        const side = Math.floor(Math.random() * 4);
        let x = 0, y = 0;

        if (side === 0) {
          x = randomRange(0, canvas.width);
          y = -20;
        } else if (side === 1) {
          x = canvas.width + 20;
          y = randomRange(0, canvas.height);
        } else if (side === 2) {
          x = randomRange(0, canvas.width);
          y = canvas.height + 20;
        } else {
          x = -20;
          y = randomRange(0, canvas.height);
        }

        enemies.push({
          x,
          y,
          radius: randomRange(12, 22),
          speed: randomRange(80, 150) + game.score * 3,
          color: '#f87171'
        });
      }

      function resetGame() {
        game.running = true;
        game.score = 0;
        game.timeLeft = 30;
        game.spawnTimer = 0;
        stars.length = 0;
        enemies.length = 0;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;

        for (let i = 0; i < 8; i++) createStar();
        for (let i = 0; i < 3; i++) createEnemy();
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = game.score;
        timeLeftEl.textContent = Math.ceil(game.timeLeft);
      }

      function endGame() {
        game.running = false;
        const msg = `游戏结束！你拿到了 ${game.score} 分，按“开始游戏”再来一轮。`;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '20px Microsoft YaHei';
        ctx.fillText(msg, canvas.width / 2, canvas.height / 2 + 20);
      }

      function update(dt) {
        if (!game.running) return;

        let moveX = 0;
        let moveY = 0;
        if (keys.ArrowLeft || keys.a) moveX -= 1;
        if (keys.ArrowRight || keys.d) moveX += 1;
        if (keys.ArrowUp || keys.w) moveY -= 1;
        if (keys.ArrowDown || keys.s) moveY += 1;

        const length = Math.hypot(moveX, moveY) || 1;
        player.x += (moveX / length) * player.speed * dt;
        player.y += (moveY / length) * player.speed * dt;
        player.x = clamp(player.x, player.radius, canvas.width - player.radius);
        player.y = clamp(player.y, player.radius, canvas.height - player.radius);

        for (let i = stars.length - 1; i >= 0; i--) {
          const s = stars[i];
          const dx = player.x - s.x;
          const dy = player.y - s.y;
          const dist = Math.hypot(dx, dy);

          if (dist < player.radius + s.radius) {
            stars.splice(i, 1);
            createStar();
            game.score += 1;
            updateHud();
          }
        }

        game.spawnTimer += dt;
        if (game.spawnTimer >= game.enemySpawn) {
          game.spawnTimer = 0;
          createEnemy();
          game.enemySpawn = Math.max(0.55, 1.2 - game.score * 0.04);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          e.x += Math.cos(angle) * e.speed * dt;
          e.y += Math.sin(angle) * e.speed * dt;

          const dist = Math.hypot(player.x - e.x, player.y - e.y);
          if (dist < player.radius + e.radius) {
            endGame();
            return;
          }
        }

        game.timeLeft -= dt;
        if (game.timeLeft <= 0) {
          game.timeLeft = 0;
          updateHud();
          endGame();
          return;
        }
        updateHud();
      }

      function drawStar(star) {
        ctx.save();
        ctx.translate(star.x, star.y);
        ctx.rotate((performance.now() / 400) + star.pulse);
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const outerRadius = star.radius;
          const innerRadius = star.radius * 0.45;
          const angle = (Math.PI / 5) * i - Math.PI / 2;
          const x1 = Math.cos(angle) * outerRadius;
          const y1 = Math.sin(angle) * outerRadius;
          const x2 = Math.cos(angle + Math.PI / 10) * innerRadius;
          const y2 = Math.sin(angle + Math.PI / 10) * innerRadius;
          if (i === 0) ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
        }
        ctx.closePath();
        ctx.fillStyle = star.color;
        ctx.shadowColor = '#fef08a';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();
      }

      function drawEnemy(enemy) {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.color;
        ctx.shadowColor = '#fecaca';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.closePath();
      }

      function drawPlayer() {
        if (player.image) {
          ctx.save();
          ctx.translate(player.x, player.y);
          ctx.drawImage(
            player.image,
            -player.imageWidth / 2,
            -player.imageHeight / 2,
            player.imageWidth,
            player.imageHeight
          );
          ctx.restore();
          return;
        }

        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.shadowColor = '#93c5fd';
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.closePath();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        stars.forEach(drawStar);
        enemies.forEach(drawEnemy);
        drawPlayer();

        if (!game.running) {
          ctx.fillStyle = 'rgba(255,255,255,0.1)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      function gameLoop(timestamp) {
        const dt = (timestamp - (game.lastTime || timestamp)) / 1000;
        game.lastTime = timestamp;

        update(dt);
        render();
        requestAnimationFrame(gameLoop);
      }

      startBtn.addEventListener('click', () => {
        resetGame();
      });

      window.addEventListener('keydown', (event) => {
        keys[event.key.toLowerCase()] = true;
      });

      window.addEventListener('keyup', (event) => {
        keys[event.key.toLowerCase()] = false;
      });

      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
